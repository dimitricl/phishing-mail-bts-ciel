services:
  nginx:
    image: nginx:alpine
    container_name: prevention-server
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./phishing-pages:/usr/share/nginx/html/phishing-pages:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - phishing_network

  mailhog:
    image: mailhog/mailhog
    platform: linux/amd64
    container_name: mailhog-smtp
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - phishing_network

networks:
  phishing_network:
    driver: bridge
